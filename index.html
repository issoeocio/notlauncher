<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NotLauncher</title>
    <meta name="description" content="NotLauncher" />
    <meta property="og:title" content="NotLauncher" />
    <meta property="og:description" content="NotLauncher" />
    <meta property="og:url" content="https://issoeocio.github.io/notlauncher/" />
    <meta property="og:image" content="https://issoeocio.github.io/notlauncher/assets/hero-showcase.jpg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://issoeocio.github.io/notlauncher/assets/hero-showcase.jpg" />
    <link rel="canonical" href="https://issoeocio.github.io/notlauncher/" />
    <link rel="icon" type="image/jpeg" href="./assets/app-icon.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-head">
        <h1 class="brand-name">NotLauncher</h1>
        <a
          href="https://github.com/issoeocio/notlauncher/releases/latest/download/notlauncher.apk"
          class="download-link"
          data-i18n="download"
        >Baixar APK</a>
      </header>

      <section class="screens-grid" aria-label="Telas">
        <figure class="screen-item">
          <button
            type="button"
            class="screen-frame"
            data-shot-src="./assets/hero-showcase.jpg"
            data-shot-label="screen_home"
          >
            <img
              src="./assets/hero-showcase.jpg"
              alt="NotLauncher — Inicial"
              referrerpolicy="no-referrer"
            />
          </button>
          <figcaption class="screen-caption" data-i18n="screen_home">Inicial</figcaption>
        </figure>

        <figure class="screen-item">
          <button
            type="button"
            class="screen-frame"
            data-shot-src="./assets/shot-news.jpg"
            data-shot-label="screen_hn"
          >
            <img
              src="./assets/shot-news.jpg"
              alt="NotLauncher — Hacker News"
              referrerpolicy="no-referrer"
            />
          </button>
          <figcaption class="screen-caption" data-i18n="screen_hn">Hacker News</figcaption>
        </figure>

        <figure class="screen-item">
          <button
            type="button"
            class="screen-frame"
            data-shot-src="./assets/shot-widgets.jpg"
            data-shot-label="screen_tools"
          >
            <img
              src="./assets/shot-widgets.jpg"
              alt="NotLauncher — Tools"
              referrerpolicy="no-referrer"
            />
          </button>
          <figcaption class="screen-caption" data-i18n="screen_tools">Tools</figcaption>
        </figure>
      </section>
    </main>

    <div
      class="lightbox"
      id="shotLightbox"
      hidden
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
      aria-labelledby="lightboxTitle"
    >
      <div class="lightbox-card">
        <div class="lightbox-head">
          <span id="lightboxTitle" class="lightbox-title"></span>
          <div class="lightbox-controls">
            <button type="button" class="lightbox-btn" id="lightboxPrev" aria-label="Anterior">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6" />
              </svg>
            </button>
            <button type="button" class="lightbox-btn" id="lightboxNext" aria-label="Próxima">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6" />
              </svg>
            </button>
            <button type="button" class="lightbox-btn" id="lightboxClose" aria-label="Fechar">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </button>
          </div>
        </div>
        <img id="lightboxImg" src="" alt="" referrerpolicy="no-referrer" />
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
